<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PesRaiyan | eFootball Tournament</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#071014;
    color:#fff;
    line-height:1.6;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
}

nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:#081419;
    border-bottom:1px solid #00e5ff55;
    backdrop-filter:blur(10px);
}

.nav-container{
    width:92%;
    max-width:1200px;
    margin:auto;
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#00e5ff;
    white-space:nowrap;
}

.nav-links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

.nav-links a{
    padding:8px 11px;
    border-radius:8px;
    color:#cbd5d8;
    font-size:13px;
    transition:.25s;
}

.nav-links a:hover{
    background:#00e5ff18;
    color:#00e5ff;
}

.hero{
    min-height:520px;
    display:flex;
    align-items:center;
    text-align:center;
    background:
        radial-gradient(circle at top,#00e5ff18,transparent 45%),
        linear-gradient(180deg,#07151b,#071014);
}

.hero-content{
    width:100%;
}

.hero h1{
    font-size:clamp(38px,7vw,75px);
    font-weight:900;
    color:#fff;
    margin-bottom:10px;
}

.hero h1 span{
    color:#00e5ff;
}

.hero p{
    color:#aebdc2;
    font-size:17px;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    padding:13px 24px;
    background:#00e5ff;
    color:#001014;
    border-radius:9px;
    font-weight:800;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px #00e5ff30;
}

.section{
    padding:70px 0;
}

.section-title{
    text-align:center;
    margin-bottom:35px;
}

.section-title h2{
    font-size:32px;
    margin-bottom:8px;
}

.section-title p{
    color:#8ea0a6;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:-45px;
    position:relative;
    z-index:2;
}

.stat-card{
    background:#0c1a20;
    border:1px solid #00e5ff25;
    border-radius:15px;
    padding:25px;
    text-align:center;
}

.stat-card h3{
    font-size:35px;
    color:#00e5ff;
}

.stat-card p{
    color:#91a3a8;
}

.player-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.player-card{
    background:#0c1a20;
    border:1px solid #00e5ff25;
    border-radius:15px;
    overflow:hidden;
    transition:.25s;
}

.player-card:hover{
    transform:translateY(-5px);
    border-color:#00e5ff88;
}

.player-photo{
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#09151a;
    overflow:hidden;
}

.player-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.avatar{
    font-size:70px;
}

.player-info{
    padding:18px;
}

.player-info h3{
    font-size:19px;
    margin-bottom:7px;
    color:#fff;
}

.player-info p{
    color:#91a3a8;
    font-size:13px;
    margin:3px 0;
}

.player-info strong{
    color:#00e5ff;
}

.table-wrap{
    overflow-x:auto;
    border-radius:14px;
    border:1px solid #00e5ff25;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
    background:#0c1a20;
}

th,td{
    padding:14px 12px;
    text-align:center;
    border-bottom:1px solid #ffffff0d;
}

th{
    background:#00e5ff12;
    color:#00e5ff;
    font-size:13px;
}

td{
    color:#d9e2e5;
    font-size:14px;
}

tbody tr:hover{
    background:#ffffff05;
}

.result-box{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.match-card{
    background:#0c
